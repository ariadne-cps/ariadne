name: Coverage

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  build:

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
            name: "macOS 26 AppleClang 21 [Coverage]",
            os: macos-26,
            cxx: "/usr/bin/clang++"
          }
          - {
            name: "Ubuntu 24.04 GCC 13 [Coverage]",
            os: ubuntu-24.04,
            cxx: "g++-13"
          }

    steps:
    - uses: actions/checkout@v3

    - name: Get macOS Concurrency
      if: runner.os == 'macOS'
      run: echo NPROC="sysctl -n hw.ncpu" >> $GITHUB_ENV

    - name: Get Linux Concurrency
      if: runner.os == 'Linux'
      run: echo NPROC="nproc" >> $GITHUB_ENV

    - name: Set Up macOS Dependencies
      if: runner.os == 'macOS'
      run: |
        brew install ninja mpfr cairo gnuplot pkg-config gnupg
        python3 -m venv "$GITHUB_WORKSPACE/.venv"
        "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip pytest
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    - name: Set Up Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build pkg-config lcov g++-13 libcairo2-dev gnuplot libmpfr-dev python3-pip python3-dev
        python3 -m venv "$GITHUB_WORKSPACE/.venv"
        "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip pytest
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{matrix.config.cxx}} -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python" -G "Ninja" -DCOVERAGE=ON -DPYTHON_ENFORCE_TESTS=ON

    - name: Build, Test and Generate Code Coverage
      working-directory: ${{runner.workspace}}/build
      run: cmake --build . --parallel $($NPROC) --target coverage

    - name: Upload Code Coverage
      if: runner.os == 'macOS'
      uses: codecov/codecov-action@v7.1.1
      with:
        files: ${{runner.workspace}}/build/coverage.info
        disable_search: true
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
