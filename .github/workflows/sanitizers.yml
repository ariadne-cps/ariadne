name: Sanitizers

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  thread-sanitizer:
    name: Ubuntu 24.04 Clang 16 [ThreadSanitizer]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config clang-16

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build-tsan" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-16 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DTHREAD_SANITIZER=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build "${{ runner.workspace }}/build-tsan" --parallel 2 --target tests

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir "${{ runner.workspace }}/build-tsan" --output-on-failure

  address-undefined-sanitizer:
    name: Ubuntu 24.04 Clang 16 [AddressSanitizer + UBSan]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.18.0"

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config clang-16

      - name: Configure CMake
        run: |
          cmake -S . -B "${{ runner.workspace }}/build-asan" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-16 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build "${{ runner.workspace }}/build-asan" --parallel 2 --target tests

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir "${{ runner.workspace }}/build-asan" --output-on-failure
