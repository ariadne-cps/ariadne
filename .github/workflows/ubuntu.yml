name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CONF: ${{ github.workspace }}/ss/bui/cmake/sccache.toml

jobs:
  build:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
        config:
          - { name: "Ubuntu 24.04 x86 Clang 16", os: ubuntu-24.04, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 arm Clang 16", os: ubuntu-24.04-arm, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 x86 GCC 13", os: ubuntu-24.04, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }
          - { name: "Ubuntu 24.04 arm GCC 13", os: ubuntu-24.04-arm, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }

    steps:
    - uses: actions/checkout@v7

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      continue-on-error: true
      with:
        version: "v0.18.0"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Get Linux Concurrency
      if: runner.os == 'Linux'
      run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

    - name: Set Up Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build pkg-config ${{ matrix.config.pkg }}

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Initialize optional sccache before compilation
      run: |
        git submodule update --init -- ss/bui
        cmake -P ss/bui/cmake/InitializeSccache.cmake

    - name: Configure CMake
      env:
        CXXFLAGS: ${{ matrix.config.libstdcxx_debug && '-D_GLIBCXX_DEBUG' || '' }}
      working-directory: ${{ runner.workspace }}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" -G Ninja -DWARNINGS_AS_ERRORS=ON -DBUILD_PYTHON_BINDINGS=ON

    - name: Build Ariadne and optional Python
      working-directory: ${{ runner.workspace }}/build
      run: |
        cmake --build . --parallel "$NPROC" --target ariadne
        if cmake --build . --target help | grep -Eq "(^|[[:space:]])pyariadne([[:space:]]|:)"; then
          cmake --build . --parallel "$NPROC" --target pyariadne
        fi





    - name: Install
      working-directory: ${{ runner.workspace }}/build
      run: cmake --install . --prefix "${{ runner.workspace }}/install"

    - name: Uninstall
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --target uninstall
